[project]
name = "robot-vacuum"
version = "0.1.0"
requires-python = ">=3.11"
description = "A WendyOS robot vacuum with MuJoCo physics, a virtual home, and video recording"
dependencies = [
    "mujoco==3.3.7",
    "numpy==2.3.3",
    "Pillow==11.3.0",
    "imageio==2.37.0",
    "imageio-ffmpeg==0.6.0",
]

[project.scripts]
robot-vacuum = "robot_vacuum:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["robot_vacuum"]

[tool.hatch.build.targets.wheel.force-include]
"assets" = "robot_vacuum/assets"
"static" = "robot_vacuum/static"
