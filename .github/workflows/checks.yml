name: Repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - run: python scripts/check_repository.py
      - run: git diff --check

  controllers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Install lightweight test dependencies
        run: python -m pip install 'numpy==1.26.4' 'pytest>=8,<9' 'scipy>=1.15,<2' 'Pillow==11.3.0' 'opencv-python-headless==4.11.0.86'
      - name: Go2 vision agent and transport
        working-directory: go2-showcase
        run: |
          python -m unittest discover -s tests -p test_ai.py -v
          python -m unittest discover -s tests -p test_action_executor.py -v
          python -m unittest discover -s tests -p test_transport.py -v
      - name: Go2 showcase server, model readiness and deploy
        working-directory: go2-showcase
        run: python -m pytest tests/test_server.py tests/test_readiness.py tests/test_deploy.py -q
      - name: ROSMASTER controller and sensor bridge
        working-directory: sassy-rosmaster
        run: |
          python -m unittest discover -s tests -p test_hardware.py -v
          python -m unittest discover -s tests -p test_navigation.py -v
          python -m unittest discover -s tests -p test_speech.py -v
          python -m unittest discover -s tests -p test_perception_ros.py -v
      - name: G1 fault handling
        working-directory: g1-can-handoff
        run: python -m unittest discover -s tests -p test_faults.py -v
      - name: Go2 assistant control, mapping, and hardware adapter
        working-directory: go2-assistant
        run: python -m pytest tests/test_air.py tests/test_core.py tests/test_hardware.py tests/test_mapping.py -q
      - name: Drone perception
        working-directory: ConstructionDroneMujoco
        run: python -m pytest tests/test_perception.py -q
      - name: Localization observation quality
        run: python -m pytest warehouse-localization/tests/test_quality.py -q

  vacuum:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: robot-vacuum
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: robot-vacuum/uv.lock
      - run: uv sync --frozen
      - run: uv run --frozen python -m unittest discover -s tests -v
      - run: uv build
