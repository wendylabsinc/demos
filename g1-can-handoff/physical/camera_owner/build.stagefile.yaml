version: 1
stages:
  - name: camera
    from: python:3.12-slim
    workdir: /app
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /app/src
    install:
      apt:
        packages:
          - libglib2.0-0
          - libgl1
          - libusb-1.0-0
      pip:
        - packages:
            - "fastapi==0.115.6"
            - "numpy==2.2.6"
            - "opencv-python-headless==4.11.0.86"
            - "pyrealsense2==2.58.3.10794"
            - "uvicorn[standard]==0.34.0"
    copy:
      - from: local
        paths:
          - s[r]c/coke_detector/__init__.py
          - s[r]c/coke_detector/settings.py
          - s[r]c/coke_detector/lease.py
          - s[r]c/coke_detector/camera_service.py
        dest: /app/src/coke_detector/
    user: root
    cmd: [python3, -m, coke_detector.camera_service]
