version: 1
stages:
  - name: native
    from: python:3.12-slim
    env:
      CYCLONEDDS_HOME: /usr/local
    install:
      apt:
        packages: [build-essential, cmake, git]
      cmake:
        - repository: https://github.com/eclipse-cyclonedds/cyclonedds.git
          commit: 2cdd114cbd18340c606573b4cc8dc20cc161ec5a
          prefix: /usr/local
          buildType: Release
          defines:
            BUILD_DDSPERF: "OFF"
            BUILD_EXAMPLES: "OFF"
            BUILD_TESTING: "OFF"
          jobs: 2
  - name: sdk
    from: native
    env:
      CYCLONEDDS_HOME: /usr/local
      LD_LIBRARY_PATH: /usr/local/lib
    install:
      pip:
        - packages:
            - "orjson==3.11.3"
            - "cyclonedds==0.10.2"
            - "git+https://github.com/unitreerobotics/unitree_sdk2_python.git@e4cd91f051aaa77a70600e3d2bf7f50889db1980"
          buildPackages: [git, build-essential]
  - name: recorder
    from: sdk
    workdir: /app
    env:
      CYCLONEDDS_HOME: /usr/local
      LD_LIBRARY_PATH: /usr/local/lib
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    copy:
      - from: local
        paths: [recorder.py, export_cdr.py]
        dest: /app/
    cmd: [python3, /app/recorder.py]
